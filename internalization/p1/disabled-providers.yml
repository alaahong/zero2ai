# ZERO2AI 出口收敛：内置 provider 禁用清单（实测导出，共 76 个内置 provider）
#
# 用法：把下面的 YAML 数组整体复制到 <项目>/.zero2ai/config.yml 的 disabledProviders 键。
# 注意：该键是「整体替换」语义而非增量合并——必须一次列全，否则漏列的 provider 仍可用。
# 保留未禁用的：litellm, llama.cpp, lm-studio, ollama, vllm（行内网关与本地推理）
#
# 生成依据：packages/catalog/src/compat/rules/providers/*.kdl

